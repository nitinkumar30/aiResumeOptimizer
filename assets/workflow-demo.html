<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Optimizer — Workflow Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0c29;
    font-family: 'Segoe UI', -apple-system, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px;
    color: #e0e0e0;
  }
  .container { max-width: 1100px; width: 100%; }

  /* HEADER */
  .header {
    text-align: center;
    padding: 20px 24px;
    background: linear-gradient(135deg, #1a1a4e, #24243e);
    border-radius: 16px;
    margin-bottom: 20px;
    border: 1px solid rgba(102,126,234,0.25);
  }
  .header h1 {
    font-size: 26px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p { color: #9ca3af; font-size: 13px; margin-top: 4px; }

  /* CONTROLS */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .controls button {
    padding: 10px 28px;
    border-radius: 25px;
    border: 1px solid rgba(102,126,234,0.35);
    background: rgba(102,126,234,0.12);
    color: #e0e0e0;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all .25s;
  }
  .controls button:hover { background: rgba(102,126,234,0.3); transform: scale(1.03); }
  .controls button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .step-badge {
    background: rgba(102,126,234,0.15);
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 13px;
    color: #a5b4fc;
    font-weight: 600;
    min-width: 130px;
    text-align: center;
  }

  /* PROGRESS */
  .progress-bar {
    height: 5px;
    background: #1a1a3e;
    border-radius: 3px;
    margin-bottom: 18px;
    overflow: hidden;
    border: 1px solid #2d2d5e;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2, #a78bfa);
    border-radius: 3px;
    transition: width .6s ease;
    width: 0%;
  }

  /* MAIN LAYOUT */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 16px;
  }

  /* WORKFLOW CANVAS */
  .canvas {
    background: #0d0d20;
    border-radius: 14px;
    padding: 20px;
    border: 1px solid #1e1b4b;
    min-height: 580px;
  }
  .node {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    margin-bottom: 0;
    border-radius: 10px;
    background: rgba(30,27,75,0.6);
    border: 1.5px solid #2d2d5e;
    transition: all .5s ease;
    opacity: 0.25;
    position: relative;
  }
  .node.visible { opacity: 1; }
  .node.active {
    opacity: 1;
    border-color: #667eea;
    background: rgba(49,46,129,0.85);
    box-shadow: 0 0 24px rgba(102,126,234,0.15), inset 0 0 40px rgba(102,126,234,0.05);
    transform: scale(1.02);
  }
  .node.done {
    opacity: 1;
    border-color: #34d399;
    background: rgba(6,78,59,0.35);
  }
  .node .num {
    font-size: 13px;
    font-weight: 800;
    color: #6b7280;
    min-width: 28px;
    text-align: center;
    transition: all .4s;
  }
  .node.active .num { color: #a5b4fc; }
  .node.done .num { color: #34d399; }
  .node .icon { font-size: 24px; min-width: 36px; text-align: center; }
  .node .info { flex: 1; min-width: 0; }
  .node .info .title { font-size: 14px; font-weight: 600; color: #e0e0e0; }
  .node .info .sub { font-size: 11px; color: #6b7280; margin-top: 1px; }
  .node.active .info .sub { color: #93c5fd; }
  .node .info .model-tag {
    display: inline-block;
    font-size: 9px;
    padding: 1px 8px;
    border-radius: 8px;
    background: rgba(102,126,234,0.12);
    color: #818cf8;
    margin-top: 3px;
  }
  .node.done .model-tag { background: rgba(52,211,153,0.12); color: #34d399; }
  .node .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 14px;
    min-width: 70px;
    text-align: center;
    transition: all .4s;
  }
  .badge.pending { background: rgba(156,163,175,0.1); color: #6b7280; }
  .badge.running { background: rgba(102,126,234,0.2); color: #818cf8; animation: pulse 1s infinite; }
  .badge.done { background: rgba(52,211,153,0.15); color: #34d399; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

  /* CONNECTOR */
  .connector {
    height: 14px;
    width: 2px;
    background: #2d2d5e;
    margin-left: 42px;
    transition: all .5s;
  }
  .connector.active { background: #667eea; box-shadow: 0 0 8px rgba(102,126,234,0.3); }
  .connector.done { background: #34d399; }

  /* DETAIL PANEL */
  .detail-panel {
    background: #0d0d20;
    border-radius: 14px;
    padding: 20px;
    border: 1px solid #1e1b4b;
    min-height: 580px;
    display: flex;
    flex-direction: column;
  }
  .detail-panel .placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #4b5563;
    text-align: center;
    gap: 8px;
  }
  .detail-panel .placeholder .big-icon { font-size: 48px; }
  .detail-panel .placeholder p { font-size: 13px; }
  .detail-content { display: none; flex-direction: column; gap: 14px; height: 100%; }
  .detail-content.show { display: flex; }
  .detail-content .dc-header { padding-bottom: 12px; border-bottom: 1px solid #1e1b4b; }
  .detail-content .dc-header .dc-num {
    font-size: 11px;
    color: #6b7280;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .detail-content .dc-header .dc-title {
    font-size: 20px;
    font-weight: 700;
    color: #e0e0e0;
    margin: 4px 0;
  }
  .detail-content .dc-header .dc-type {
    display: inline-block;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 8px;
    background: rgba(102,126,234,0.12);
    color: #818cf8;
    font-weight: 600;
  }
  .detail-content .dc-body { flex: 1; }
  .detail-content .dc-body .dc-label {
    font-size: 11px;
    color: #6b7280;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 10px 0 4px;
  }
  .detail-content .dc-body .dc-desc {
    font-size: 13px;
    color: #d1d5db;
    line-height: 1.6;
  }
  .detail-content .dc-body .dc-detail-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    font-size: 12px;
  }
  .detail-content .dc-body .dc-detail-row .key { color: #9ca3af; }
  .detail-content .dc-body .dc-detail-row .val { color: #e0e0e0; font-weight: 600; }

  /* LOG PANEL */
  .log-panel {
    margin-top: 16px;
    background: #0a0a18;
    border-radius: 12px;
    padding: 14px 16px;
    border: 1px solid #1e1b4b;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 12px;
    height: 110px;
    overflow-y: auto;
  }
  .log-panel::-webkit-scrollbar { width: 4px; }
  .log-panel::-webkit-scrollbar-track { background: #0a0a18; }
  .log-panel::-webkit-scrollbar-thumb { background: #2d2d5e; border-radius: 2px; }
  .log-panel .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
  .log-panel .log-entry:last-child { border-bottom: none; }
  .log-panel .t { color: #4b5563; }
  .log-panel .m { color: #9ca3af; }
  .log-panel .m.info { color: #818cf8; }
  .log-panel .m.ok { color: #34d399; }
  .log-panel .m.warn { color: #fbbf24; }

  @media (max-width: 800px) {
    .main-grid { grid-template-columns: 1fr; }
    .detail-panel { min-height: auto; }
    .node { padding: 10px 12px; }
    .node .badge { min-width: 60px; font-size: 9px; }
  }
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>AI Resume Optimizer — Workflow Demo</h1>
  <p>Watch each n8n node execute step-by-step, from form submission to Telegram delivery</p>
</div>

<div class="controls">
  <button id="playBtn" onclick="startDemo()">▶ Play Demo</button>
  <button onclick="resetDemo()">↺ Reset</button>
  <span class="step-badge" id="stepBadge">⏸ Ready</span>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="main-grid">
  <!-- LEFT: Workflow Nodes -->
  <div class="canvas" id="canvas"></div>

  <!-- RIGHT: Detail Panel -->
  <div class="detail-panel" id="detailPanel">
    <div class="placeholder" id="placeholder">
      <div class="big-icon">▶</div>
      <p>Press <strong>Play Demo</strong> to watch the workflow execute one node at a time</p>
    </div>
    <div class="detail-content" id="detailContent"></div>
  </div>
</div>

<!-- LOG -->
<div class="log-panel" id="logPanel"></div>

</div>

<script>
const NODES = [
  { id:"trigger",        num:"01", icon:"📝", title:"Resume &amp; JD submitted",   type:"Form Trigger",      model:"n8n Built-in",   desc:"Web form collects the user's resume file (.pdf/.docx) and job description text. Generates a unique production URL you can share with anyone.", conn:"Connects to: Extract from File" },
  { id:"extract",        num:"02", icon:"📂", title:"Extract from File",            type:"Extract File",      model:"n8n Built-in",   desc:"Reads the uploaded binary file and extracts plain text. Supports both PDF and DOCX formats via n8n's native extraction engine.", conn:"Connects to: Resume extractor, JD extractor" },
  { id:"resume-parser",  num:"03", icon:"🧠", title:"Resume extractor",             type:"AI Agent",          model:"Gemini / GPT",   desc:"Parses the extracted resume text into a detailed structured JSON. Extracts identity, contact, work history, skills, education, achievements — with strict anti-hallucination rules.", conn:"Connects to: JD extractor (serial) or parallel" },
  { id:"jd-parser",      num:"04", icon:"🎯", title:"JD extractor",                 type:"AI Agent",          model:"Gemini / GPT",   desc:"Analyzes the job description. Classifies domain, seniority level, extracts must-have vs good-to-have skills, maps responsibilities (core/secondary/strategic/operational), and ranks keywords by priority.", conn:"Connects to: Wait for Resume & JD (Merge)" },
  { id:"merge",          num:"05", icon:"🔀", title:"Wait for Resume &amp; JD",     type:"Merge Node",        model:"—",              desc:"Syncs the two parallel JSON outputs (Resume JSON + JD JSON) into a single execution context. Ensures both are ready before proceeding to generation.", conn:"Connects to: Generated resume unformatted" },
  { id:"latex-gen",      num:"06", icon:"✍️",  title:"Generated resume unformatted", type:"AI Agent",          model:"Gemini / GPT",   desc:"The core intelligence node. Receives both JSONs and fills a locked LaTeX skeleton. Rewrites experience bullets with action verbs, injects JD keywords naturally, reorders skills by priority, and outputs compilable LaTeX.", conn:"Splits to: Prepare compilation ready + ATS Score Agent + Cover Letter Agent" },
  { id:"ats-score",      num:"07", icon:"📊", title:"ATS Score Agent",              type:"AI Agent",          model:"Gemini / GPT",   desc:"Calculates a 0-100 match score using a 4-factor model: Keyword Coverage (40%), Skills Alignment (30%), Experience Relevance (20%), Role Title Match (10%). Produces 3 targeted gap bullets.", conn:"Connects to: Cover Letter Agent" },
  { id:"cover-letter",   num:"08", icon:"📝", title:"Cover Letter Agent",           type:"AI Agent",          model:"Gemini / GPT",   desc:"Writes a 5-paragraph HTML cover letter: strong hook, why this role, 2-3 quantified achievements, addresses skill gap as learning narrative, confident closing. Gmail-compatible inline CSS.", conn:"Connects to: Build Caption + Cover Letter" },
  { id:"prepare",        num:"09", icon:"🔧", title:"Prepare compilation ready",    type:"Code (JavaScript)", model:"—",              desc:"Cleans the LLM output: strips markdown fences (```latex), slices from \\\\documentclass to \\\\end{document}, extracts candidate name from Resume JSON, sanitizes filename, and JSON.stringifys the request body.", conn:"Connects to: Compile latex code" },
  { id:"compile",        num:"10", icon:"🖨️", title:"Compile latex code",           type:"HTTP Request",      model:"latex.ytotech.com", desc:"POSTs the LaTeX source to the free ytotech compilation API. Specifies pdflatex compiler. Receives compiled PDF binary as response. Configured with retry-on-fail (3 retries, 5s wait).", conn:"Connects to: Compile & convert to pdf file" },
  { id:"convert",        num:"11", icon:"📄", title:"Compile &amp; convert to pdf", type:"Code (JavaScript)", model:"—",              desc:"Passes the binary PDF through untouched while attaching filename metadata (FirstName_LastName_Resume.pdf) and candidateName for the Telegram caption.", conn:"Connects to: Build Caption + Cover Letter" },
  { id:"caption",        num:"12", icon:"🔗", title:"Build Caption + Cover Letter", type:"Code (JavaScript)", model:"—",              desc:"Parses ATS Score Agent output, builds a visual score bar (🟩🟩🟩🟩⬜⬜), constructs Telegram caption with emoji indicators, and attaches the HTML cover letter as a binary file.", conn:"Splits to: Send resume via telegram + Send Cover Letter via Telegram" },
  { id:"telegram-pdf",   num:"13", icon:"📬", title:"Send resume via Telegram",    type:"Telegram",          model:"Telegram Bot API", desc:"Sends the compiled PDF as a Telegram document with caption showing the ATS score, recommendation, and top 3 gaps to address. Uses the configured Chat ID.", conn:"Final node" },
  { id:"telegram-cl",    num:"14", icon:"💌", title:"Send Cover Letter via Telegram", type:"Telegram",       model:"Telegram Bot API", desc:"Sends the HTML cover letter as a Telegram document alongside the resume PDF. Both files arrive simultaneously for a complete delivery experience.", conn:"Final node" }
];

const LOGS = [
  { t:"00:00", m:"Workflow started — form submitted with Resume + JD", s:"info" },
  { t:"00:01", m:"📝 Form trigger received payload", s:"info" },
  { t:"00:02", m:"📂 Extracting text from uploaded file (PDF/DOCX)", s:"info" },
  { t:"00:03", m:"📂 Text extraction complete — sending to Resume parser", s:"ok" },
  { t:"00:04", m:"🧠 Resume parser: analyzing document structure", s:"info" },
  { t:"00:07", m:"🧠 Resume JSON ready — identity, skills, history extracted", s:"ok" },
  { t:"00:08", m:"🎯 JD parser: analyzing job description", s:"info" },
  { t:"00:12", m:"🎯 JD analyzed — domain, keywords, priorities identified", s:"ok" },
  { t:"00:13", m:"🔀 Merge node: both JSONs synchronized", s:"ok" },
  { t:"00:14", m:"✍️ LaTeX generator: writing ATS-optimized resume", s:"info" },
  { t:"00:20", m:"✍️ LaTeX generated — action verbs + JD keywords injected", s:"ok" },
  { t:"00:21", m:"📊 ATS Score Agent: calculating match score", s:"info" },
  { t:"00:24", m:"📊 Score: 85/100 — Strong Match — 3 gaps identified", s:"ok" },
  { t:"00:25", m:"📝 Cover Letter Agent: writing personalized HTML letter", s:"info" },
  { t:"00:30", m:"📝 Cover letter ready — 340 words, Gmail-compatible HTML", s:"ok" },
  { t:"00:31", m:"🔧 Cleaning LaTeX output — stripping markdown fences", s:"info" },
  { t:"00:32", m:"🔧 Building API request body for pdfLaTeX compiler", s:"ok" },
  { t:"00:33", m:"🖨️ Sending LaTeX to compilation API (ytotech.com)", s:"info" },
  { t:"00:38", m:"🖨️ PDF compiled successfully — 3 pages", s:"ok" },
  { t:"00:39", m:"📄 Attaching filename: Nitin_Kumar_Resume.pdf", s:"ok" },
  { t:"00:40", m:"🔗 Building Telegram caption with ATS score bar + cover letter", s:"info" },
  { t:"00:41", m:"🔗 Caption ready — sending to Telegram nodes", s:"ok" },
  { t:"00:42", m:"📬 Sending resume PDF via Telegram...", s:"info" },
  { t:"00:43", m:"💌 Sending cover letter HTML via Telegram...", s:"info" },
  { t:"00:44", m:"✅ Both deliveries complete! Check Telegram.", s:"ok" }
];

const STEP_NODES = [
  [],                    // step 0
  ["trigger"],           // 1
  ["trigger"],           // 2
  ["extract"],           // 3
  ["extract"],           // 4
  ["resume-parser"],     // 5
  ["resume-parser"],     // 6
  ["jd-parser"],         // 7
  ["jd-parser"],         // 8
  ["merge"],             // 9
  ["latex-gen"],          // 10
  ["latex-gen"],          // 11
  ["ats-score"],         // 12
  ["ats-score"],         // 13
  ["cover-letter"],      // 14
  ["cover-letter"],      // 15
  ["prepare"],           // 16
  ["prepare"],           // 17
  ["compile"],           // 18
  ["compile"],           // 19
  ["convert"],           // 20
  ["caption"],           // 21
  ["caption"],           // 22
  ["telegram-pdf"],      // 23
  ["telegram-cl"],       // 24
  ["telegram-pdf","telegram-cl"], // 25
  ["telegram-pdf","telegram-cl"]  // 26
];

const DONE_NODES = [
  [],
  ["trigger"],
  ["trigger"],
  ["extract"],
  ["trigger","extract"],
  ["trigger","extract","resume-parser"],
  ["trigger","extract","resume-parser"],
  ["trigger","extract","jd-parser"],
  ["trigger","extract","resume-parser","jd-parser"],
  ["trigger","extract","resume-parser","jd-parser","merge"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","ats-score"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","ats-score"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","ats-score","cover-letter"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","ats-score","cover-letter"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","prepare"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","prepare"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","prepare","compile"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","prepare","compile"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","prepare","compile","convert"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","prepare","compile","convert","caption"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","prepare","compile","convert","caption"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","prepare","compile","convert","caption","telegram-pdf"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","prepare","compile","convert","caption","telegram-cl"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","prepare","compile","convert","caption","telegram-pdf","telegram-cl"],
  ["trigger","extract","resume-parser","jd-parser","merge","latex-gen","prepare","compile","convert","caption","telegram-pdf","telegram-cl"]
];

let stepIdx = -1;
let timer = null;

function renderCanvas() {
  const canvas = document.getElementById('canvas');
  let html = '';
  NODES.forEach((n, i) => {
    html += `
      <div class="node" id="n-${n.id}">
        <div class="num">${n.num}</div>
        <div class="icon">${n.icon}</div>
        <div class="info">
          <div class="title">${n.title}</div>
          <div class="sub">${n.type}</div>
          ${n.model !== '—' ? `<span class="model-tag">${n.model}</span>` : ''}
        </div>
        <div class="badge pending" id="b-${n.id}">⏸ Pending</div>
      </div>`;
    if (i < NODES.length - 1) {
      html += `<div class="connector" id="c-${i}"></div>`;
    }
  });
  canvas.innerHTML = html;
}

function setNodeState(id, state) {
  const el = document.getElementById('n-' + id);
  if (!el) return;
  el.className = 'node visible ' + state;
  const badge = document.getElementById('b-' + id);
  if (badge) {
    badge.className = 'badge ' + state;
    badge.textContent = state === 'done' ? '✅ Done' : state === 'active' ? '⏳ Running...' : '⏸ Pending';
  }
}

function setConn(idx, state) {
  const el = document.getElementById('c-' + idx);
  if (el) { el.className = 'connector ' + state; }
}

function showDetail(nodeId) {
  const node = NODES.find(n => n.id === nodeId);
  const placeholder = document.getElementById('placeholder');
  const content = document.getElementById('detailContent');
  if (!node) { placeholder.style.display = 'flex'; content.classList.remove('show'); return; }
  placeholder.style.display = 'none';
  content.classList.add('show');
  content.innerHTML = `
    <div class="dc-header">
      <div class="dc-num">NODE ${node.num}</div>
      <div class="dc-title">${node.icon} ${node.title}</div>
      <span class="dc-type">${node.type}</span>
    </div>
    <div class="dc-body">
      <div class="dc-label">Description</div>
      <div class="dc-desc">${node.desc}</div>
      <div class="dc-label">Details</div>
      <div class="dc-detail-row"><span class="key">Type</span><span class="val">${node.type}</span></div>
      <div class="dc-detail-row"><span class="key">AI Model</span><span class="val">${node.model}</span></div>
      <div class="dc-detail-row"><span class="key">Connection</span><span class="val">${node.conn}</span></div>
    </div>`;
}

function addLog(t, m, s) {
  const panel = document.getElementById('logPanel');
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `<span class="t">[${t}]</span> <span class="m ${s}">${m}</span>`;
  panel.appendChild(div);
  panel.scrollTop = panel.scrollHeight;
}

function startDemo() {
  if (timer) return;
  document.getElementById('playBtn').disabled = true;
  document.getElementById('playBtn').textContent = '⏳ Running...';
  stepIdx = -1;
  document.getElementById('logPanel').innerHTML = '';
  advance();
}

function advance() {
  stepIdx++;
  if (stepIdx >= LOGS.length) { finish(); return; }

  const log = LOGS[stepIdx];
  const pct = Math.round((stepIdx / LOGS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stepBadge').textContent = `Step ${stepIdx + 1}/${LOGS.length}`;

  addLog(log.t, log.m, log.s);

  // Update node states
  const activeNodes = STEP_NODES[stepIdx] || [];
  const doneNodes = DONE_NODES[stepIdx] || [];

  NODES.forEach((n, i) => {
    if (doneNodes.includes(n.id)) {
      setNodeState(n.id, 'done');
      if (i > 0) setConn(i - 1, 'done');
    } else if (activeNodes.includes(n.id)) {
      setNodeState(n.id, 'active');
      showDetail(n.id);
      if (i > 0) setConn(i - 1, 'active');
    } else {
      setNodeState(n.id, 'visible');
    }
  });

  // Show first node's detail on step 1
  if (stepIdx === 1) showDetail('trigger');

  // Different delays per step (slower for active processing, faster for transitions)
  const delays = [500, 800, 800, 600, 1000, 800, 1000, 800, 600, 1200, 800, 1000, 800, 1000, 800, 800, 600, 800, 1000, 600, 600, 800, 600, 800, 800, 600, 800];
  const delay = delays[stepIdx] || 700;
  timer = setTimeout(advance, delay);
}

function finish() {
  clearTimeout(timer); timer = null;
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('stepBadge').textContent = '✅ Complete!';
  document.getElementById('playBtn').disabled = false;
  document.getElementById('playBtn').textContent = '▶ Replay';
  addLog('00:45', '🎉 Workflow complete! PDF + Cover Letter + ATS Score sent to Telegram.', 'ok');
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('detailContent').classList.add('show');
  const lastNode = NODES[NODES.length - 1];
  showDetail(lastNode.id);
}

function resetDemo() {
  clearTimeout(timer); timer = null;
  stepIdx = -1;
  document.getElementById('playBtn').disabled = false;
  document.getElementById('playBtn').textContent = '▶ Play Demo';
  document.getElementById('stepBadge').textContent = '⏸ Ready';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('logPanel').innerHTML = '';
  document.getElementById('placeholder').style.display = 'flex';
  document.getElementById('detailContent').classList.remove('show');
  NODES.forEach((n, i) => {
    setNodeState(n.id, 'visible');
    if (i < NODES.length - 1) setConn(i, '');
  });
}

renderCanvas();
</script>
</body>
</html>
