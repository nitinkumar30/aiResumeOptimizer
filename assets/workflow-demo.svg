<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/><stop offset="50%" style="stop-color:#1a1a4e"/><stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title { font:bold 22px Arial,sans-serif; fill:url(#accent); }
      .sub { font:13px Arial,sans-serif; fill:#9ca3af; }
      .n-num { font:bold 12px Arial,sans-serif; fill:#6b7280; }
      .n-name { font:bold 13px Arial,sans-serif; fill:#e0e0e0; }
      .n-type { font:10px Arial,sans-serif; fill:#6b7280; }
      .n-model { font:9px Arial,sans-serif; fill:#818cf8; }
      .box { fill:rgba(30,27,75,0.6); stroke:#2d2d5e; stroke-width:1.2; rx:8; }
      .conn { stroke:#2d2d5e; stroke-width:1.5; }
    </style>
  </defs>
  <rect width="900" height="620" fill="url(#bg)" rx="14"/>
  <text x="450" y="35" text-anchor="middle" class="title">AI Resume Optimizer — Workflow</text>
  <text x="450" y="55" text-anchor="middle" class="sub">14 nodes executing sequentially — one at a time, top to bottom</text>

  <!-- Timeline bar -->
  <rect x="40" y="70" width="820" height="3" rx="1.5" fill="#1a1a3e" stroke="#2d2d5e" stroke-width="0.5"/>

  <!-- Helper: Node template -->
  <g id="render"></g>

  <!-- Manually lay out 14 nodes -->
  <!-- NODE 1 -->
  <rect x="50" y="85" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="105" class="n-num">01</text>
  <text x="90" y="105" font-size="16">📝</text>
  <text x="120" y="105" class="n-name">Resume &amp; JD submitted</text>
  <text x="350" y="105" class="n-type">Form Trigger</text>

  <line x1="450" y1="117" x2="450" y2="128" class="conn"/>

  <!-- NODE 2 -->
  <rect x="50" y="128" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="148" class="n-num">02</text>
  <text x="90" y="148" font-size="16">📂</text>
  <text x="120" y="148" class="n-name">Extract from File</text>
  <text x="350" y="148" class="n-type">Extract File</text>

  <line x1="450" y1="160" x2="450" y2="171" class="conn"/>

  <!-- NODE 3 -->
  <rect x="50" y="171" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="191" class="n-num">03</text>
  <text x="90" y="191" font-size="16">🧠</text>
  <text x="120" y="191" class="n-name">Resume extractor</text>
  <text x="350" y="191" class="n-type">AI Agent</text>
  <text x="480" y="191" class="n-model">Gemini / GPT</text>

  <line x1="450" y1="203" x2="450" y2="214" class="conn"/>

  <!-- NODE 4 -->
  <rect x="50" y="214" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="234" class="n-num">04</text>
  <text x="90" y="234" font-size="16">🎯</text>
  <text x="120" y="234" class="n-name">JD extractor</text>
  <text x="350" y="234" class="n-type">AI Agent</text>
  <text x="480" y="234" class="n-model">Gemini / GPT</text>

  <line x1="450" y1="246" x2="450" y2="257" class="conn"/>

  <!-- NODE 5 -->
  <rect x="50" y="257" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="277" class="n-num">05</text>
  <text x="90" y="277" font-size="16">🔀</text>
  <text x="120" y="277" class="n-name">Wait for Resume &amp; JD</text>
  <text x="350" y="277" class="n-type">Merge Node</text>

  <line x1="450" y1="289" x2="450" y2="300" class="conn"/>

  <!-- NODE 6 -->
  <rect x="50" y="300" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="320" class="n-num">06</text>
  <text x="90" y="320" font-size="16">✍️</text>
  <text x="120" y="320" class="n-name">Generated resume unformatted</text>
  <text x="350" y="320" class="n-type">AI Agent</text>
  <text x="510" y="320" class="n-model">Gemini / GPT</text>

  <line x1="450" y1="332" x2="450" y2="343" class="conn"/>

  <!-- NODE 7 -->
  <rect x="50" y="343" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="363" class="n-num">07</text>
  <text x="90" y="363" font-size="16">📊</text>
  <text x="120" y="363" class="n-name">ATS Score Agent</text>
  <text x="350" y="363" class="n-type">AI Agent</text>
  <text x="480" y="363" class="n-model">Gemini / GPT</text>

  <line x1="450" y1="375" x2="450" y2="386" class="conn"/>

  <!-- NODE 8 -->
  <rect x="50" y="386" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="406" class="n-num">08</text>
  <text x="90" y="406" font-size="16">📝</text>
  <text x="120" y="406" class="n-name">Cover Letter Agent</text>
  <text x="350" y="406" class="n-type">AI Agent</text>
  <text x="480" y="406" class="n-model">Gemini / GPT</text>

  <line x1="450" y1="418" x2="450" y2="429" class="conn"/>

  <!-- NODE 9 -->
  <rect x="50" y="429" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="449" class="n-num">09</text>
  <text x="90" y="449" font-size="16">🔧</text>
  <text x="120" y="449" class="n-name">Prepare compilation ready</text>
  <text x="350" y="449" class="n-type">Code (JavaScript)</text>

  <line x1="450" y1="461" x2="450" y2="472" class="conn"/>

  <!-- NODE 10 -->
  <rect x="50" y="472" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="492" class="n-num">10</text>
  <text x="90" y="492" font-size="16">🖨️</text>
  <text x="120" y="492" class="n-name">Compile latex code</text>
  <text x="350" y="492" class="n-type">HTTP Request</text>
  <text x="490" y="492" class="n-model">ytotech.com API</text>

  <line x1="450" y1="504" x2="450" y2="515" class="conn"/>

  <!-- NODE 11 -->
  <rect x="50" y="515" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="535" class="n-num">11</text>
  <text x="90" y="535" font-size="16">📄</text>
  <text x="120" y="535" class="n-name">Compile &amp; convert to pdf</text>
  <text x="350" y="535" class="n-type">Code (JavaScript)</text>

  <line x1="450" y1="547" x2="450" y2="558" class="conn"/>

  <!-- NODE 12 -->
  <rect x="50" y="558" width="800" height="32" rx="7" class="box"/>
  <text x="65" y="578" class="n-num">12</text>
  <text x="90" y="578" font-size="16">🔗</text>
  <text x="120" y="578" class="n-name">Build Caption + Cover Letter</text>
  <text x="350" y="578" class="n-type">Code (JavaScript)</text>

  <line x1="450" y1="590" x2="370" y2="595" class="conn"/>
  <line x1="450" y1="590" x2="530" y2="595" class="conn"/>

  <!-- NODE 13 -->
  <rect x="50" y="595" width="380" height="22" rx="6" class="box"/>
  <text x="65" y="610" class="n-num" font-size="10">13</text>
  <text x="85" y="610" font-size="12">📬</text>
  <text x="105" y="610" class="n-name" font-size="11">Send Resume via Telegram</text>
  <text x="300" y="610" class="n-type" font-size="9">Telegram</text>

  <!-- NODE 14 -->
  <rect x="470" y="595" width="380" height="22" rx="6" class="box"/>
  <text x="485" y="610" class="n-num" font-size="10">14</text>
  <text x="505" y="610" font-size="12">💌</text>
  <text x="525" y="610" class="n-name" font-size="11">Send Cover Letter</text>
  <text x="700" y="610" class="n-type" font-size="9">Telegram</text>

</svg>
