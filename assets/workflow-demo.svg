<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/><stop offset="50%" style="stop-color:#1a1a4e"/><stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:0.9"/><stop offset="100%" style="stop-color:#111;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#667eea" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    @keyframes flowArrow { 0%{stroke-dashoffset:100} 100%{stroke-dashoffset:0} }
    @keyframes nodeActive { 0%,100%{fill:#1e1b4b;stroke:#667eea} 50%{fill:#312e81;stroke:#a78bfa} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes checkmark { 0%{stroke-dashoffset:50} 100%{stroke-dashoffset:0} }
    @keyframes typing { 0%,100%{opacity:0.3} 50%{opacity:1} }
    @keyframes progressBar { 0%{width:0%} 100%{width:100%} }
    .title-text { font-family:Arial,sans-serif; font-size:28px; font-weight:bold; fill:url(#accent); }
    .subtitle-text { font-family:Arial,sans-serif; font-size:14px; fill:#9ca3af; }
    .node-text { font-family:Arial,sans-serif; font-size:11px; fill:#e0e0e0; }
    .node-subtext { font-family:Arial,sans-serif; font-size:9px; fill:#9ca3af; }
    .flow-line { stroke:#374151; stroke-width:2; fill:none; stroke-dasharray:6,4; }
    .flow-line-active { stroke:#667eea; stroke-width:2.5; fill:none; stroke-dasharray:6,4; animation:flowArrow 1s linear infinite; }
    .node-box { fill:url(#nodeGrad); stroke:#374151; stroke-width:1.5; rx:8; ry:8; transition:all 0.3s; }
    .node-box-active { fill:#312e81; stroke:#a78bfa; stroke-width:2; rx:8; ry:8; filter:url(#glow); }
    .status-dot { fill:#9ca3af; r:5; }
    .status-dot-active { fill:#34d399; r:6; filter:url(#glow); }
    .step-label { font-family:Arial,sans-serif; font-size:10px; fill:#6b7280; }
  </style>

  <title>AI Resume Optimizer - Workflow Demo</title>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Header -->
  <text x="600" y="40" text-anchor="middle" class="title-text">AI Resume Optimizer - Workflow Demo</text>
  <text x="600" y="62" text-anchor="middle" class="subtitle-text">n8n Automation  |  13 Nodes  |  3 AI Stages  |  60-90s Processing</text>

  <!-- Top bar -->
  <rect x="0" y="75" width="1200" height="3" fill="url(#accent)"/>

  <!-- Timeline progress -->
  <rect x="50" y="90" width="1100" height="8" rx="4" fill="#1e1b4b" stroke="#374151" stroke-width="1"/>
  <rect x="50" y="90" width="0%" height="8" rx="4" fill="url(#accent)" id="progressAnim">
    <animate attributeName="width" from="0%" to="100%" dur="14s" repeatCount="indefinite"/>
  </rect>

  <!-- ====================== NODE 1: FORM TRIGGER ====================== -->
  <g opacity="1">
    <rect x="50" y="120" width="260" height="75" rx="8" class="node-box" stroke="#60a5fa">
      <animate attributeName="stroke" values="#374151;#60a5fa;#60a5fa;#374151;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="180" y="150" text-anchor="middle" class="node-text">1. Resume &amp; JD submitted</text>
    <text x="180" y="168" text-anchor="middle" class="node-subtext">Form Trigger - Collects Resume + JD</text>
    <circle cx="60" cy="130" r="6" fill="#60a5fa">
      <animate attributeName="fill" values="#9ca3af;#60a5fa;#60a5fa;#9ca3af;#9ca3af" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="310" y1="157" x2="370" y2="157" class="flow-line">
    <animate attributeName="stroke" values="#374151;#667eea;#667eea;#374151;#374151" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  <polygon points="370,152 380,157 370,162" fill="#374151">
    <animate attributeName="fill" values="#374151;#667eea;#667eea;#374151;#374151" dur="14s" repeatCount="indefinite"/>
  </polygon>

  <!-- ====================== NODE 2: EXTRACT FROM FILE ====================== -->
  <g>
    <rect x="380" y="120" width="260" height="75" rx="8" class="node-box" stroke="#34d399">
      <animate attributeName="stroke" values="#374151;#374151;#34d399;#34d399;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="510" y="150" text-anchor="middle" class="node-text">2. Extract from File</text>
    <text x="510" y="168" text-anchor="middle" class="node-subtext">Reads PDF/DOCX to Plain Text</text>
    <circle cx="390" cy="130" r="6" fill="#9ca3af">
      <animate attributeName="fill" values="#9ca3af;#9ca3af;#34d399;#34d399;#9ca3af" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Arrow 2→3+4 (parallel split) -->
  <line x1="640" y1="157" x2="700" y2="157" class="flow-line">
    <animate attributeName="stroke" values="#374151;#374151;#667eea;#667eea;#374151" dur="14s" repeatCount="indefinite"/>
  </line>
  <line x1="700" y1="157" x2="700" y2="220" class="flow-line">
    <animate attributeName="stroke" values="#374151;#374151;#667eea;#667eea;#374151" dur="14s" repeatCount="indefinite"/>
  </line>
  <line x1="700" y1="157" x2="700" y2="310" class="flow-line">
    <animate attributeName="stroke" values="#374151;#374151;#667eea;#667eea;#374151" dur="14s" repeatCount="indefinite"/>
  </line>
  <text x="710" y="235" font-family="Arial" font-size="10" fill="#fcd34d">Parallel</text>
  <text x="710" y="248" font-family="Arial" font-size="10" fill="#fcd34d">Split</text>
  <polygon points="700,310 705,300 695,300" fill="#374151"/>

  <!-- ====================== NODE 3: RESUME EXTRACTOR ====================== -->
  <g>
    <rect x="50" y="200" width="260" height="75" rx="8" class="node-box" stroke="#a78bfa">
      <animate attributeName="stroke" values="#374151;#374151;#a78bfa;#a78bfa;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="180" y="230" text-anchor="middle" class="node-text">3. Resume extractor</text>
    <text x="180" y="248" text-anchor="middle" class="node-subtext">AI: Text → Structured JSON</text>
    <circle cx="60" cy="210" r="6" fill="#9ca3af">
      <animate attributeName="fill" values="#9ca3af;#9ca3af;#a78bfa;#a78bfa;#9ca3af" dur="14s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="263" font-family="Arial" font-size="9" fill="#6b7280">Model: Gemini / GPT</text>
  </g>

  <!-- ====================== NODE 4: JD EXTRACTOR ====================== -->
  <g>
    <rect x="380" y="290" width="260" height="75" rx="8" class="node-box" stroke="#a78bfa">
      <animate attributeName="stroke" values="#374151;#a78bfa;#a78bfa;#374151;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="510" y="320" text-anchor="middle" class="node-text">4. JD extractor</text>
    <text x="510" y="338" text-anchor="middle" class="node-subtext">AI: JD → Keywords + Priority</text>
    <circle cx="390" cy="300" r="6" fill="#9ca3af">
      <animate attributeName="fill" values="#9ca3af;#a78bfa;#a78bfa;#9ca3af;#9ca3af" dur="14s" repeatCount="indefinite"/>
    </circle>
    <text x="400" y="353" font-family="Arial" font-size="9" fill="#6b7280">Model: Gemini / GPT</text>
  </g>

  <!-- Arrow 3→Merge, 4→Merge -->
  <line x1="310" y1="237" x2="700" y2="370" class="flow-line"/>
  <line x1="640" y1="327" x2="700" y2="370" class="flow-line"/>
  <polygon points="700,370 705,360 695,360" fill="#374151"/>

  <!-- ====================== NODE 5: MERGE ====================== -->
  <g>
    <rect x="380" y="380" width="260" height="65" rx="8" class="node-box" stroke="#fcd34d">
      <animate attributeName="stroke" values="#374151;#fcd34d;#fcd34d;#374151;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="510" y="408" text-anchor="middle" class="node-text">5. Wait for Resume &amp; JD</text>
    <text x="510" y="425" text-anchor="middle" class="node-subtext">Merge Node - Syncs Both JSONs</text>
    <circle cx="390" cy="390" r="6" fill="#fcd34d">
      <animate attributeName="fill" values="#9ca3af;#fcd34d;#fcd34d;#9ca3af;#9ca3af" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Arrow Merge→5 -->
  <line x1="640" y1="412" x2="700" y2="450" class="flow-line"/>
  <polygon points="700,450 705,440 695,440" fill="#374151"/>

  <!-- ====================== NODE 6: GENERATE RESUME ====================== -->
  <g>
    <rect x="50" y="430" width="290" height="75" rx="8" class="node-box" stroke="#667eea">
      <animate attributeName="stroke" values="#374151;#667eea;#667eea;#667eea;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="195" y="460" text-anchor="middle" class="node-text">6. Generated resume unformatted</text>
    <text x="195" y="478" text-anchor="middle" class="node-subtext">AI: Fills LaTeX Skeleton with ATS Content</text>
    <circle cx="60" cy="440" r="6" fill="#667eea">
      <animate attributeName="fill" values="#9ca3af;#667eea;#667eea;#667eea;#9ca3af" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Split from 6 to 7a, 7b -->
  <line x1="340" y1="467" x2="400" y2="467" class="flow-line"/>
  <line x1="400" y1="467" x2="400" y2="530" class="flow-line"/>
  <line x1="400" y1="467" x2="400" y2="600" class="flow-line"/>

  <!-- ====================== NODE 7A: PREPARE ====================== -->
  <g>
    <rect x="380" y="510" width="260" height="65" rx="8" class="node-box" stroke="#f472b6">
      <animate attributeName="stroke" values="#374151;#f472b6;#f472b6;#374151;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="510" y="538" text-anchor="middle" class="node-text">7a. Prepare compilation ready</text>
    <text x="510" y="555" text-anchor="middle" class="node-subtext">Code: Cleans LaTeX + Extract Name</text>
    <circle cx="390" cy="520" r="6" fill="#f472b6"/>
  </g>

  <!-- ====================== NODE 7B: ATS SCORE ====================== -->
  <g>
    <rect x="440" y="580" width="260" height="65" rx="8" class="node-box" stroke="#34d399">
      <animate attributeName="stroke" values="#374151;#34d399;#34d399;#374151;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="570" y="608" text-anchor="middle" class="node-text">7b. ATS Score Agent</text>
    <text x="570" y="625" text-anchor="middle" class="node-subtext">AI: 0-100 Match Score + Gap Analysis</text>
    <circle cx="450" cy="590" r="6" fill="#34d399"/>
  </g>

  <!-- Arrow 7a→8 -->
  <line x1="640" y1="542" x2="700" y2="585" class="flow-line"/>

  <!-- ====================== NODE 8: COMPILE ====================== -->
  <g>
    <rect x="710" y="565" width="260" height="65" rx="8" class="node-box" stroke="#f59e0b">
      <animate attributeName="stroke" values="#374151;#f59e0b;#f59e0b;#374151;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="840" y="593" text-anchor="middle" class="node-text">8. Compile latex code</text>
    <text x="840" y="610" text-anchor="middle" class="node-subtext">API: pdflatex → PDF Binary</text>
    <circle cx="720" cy="575" r="6" fill="#f59e0b"/>
  </g>

  <!-- Arrow 8→9 -->
  <line x1="970" y1="597" x2="990" y2="663" class="flow-line"/>

  <!-- ====================== NODE 9: CONVERT ====================== -->
  <g>
    <rect x="710" y="645" width="260" height="65" rx="8" class="node-box" stroke="#60a5fa">
      <animate attributeName="stroke" values="#374151;#60a5fa;#60a5fa;#374151;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="840" y="673" text-anchor="middle" class="node-text">9. Compile &amp; convert to pdf</text>
    <text x="840" y="690" text-anchor="middle" class="node-subtext">Code: Attach Filename Metadata</text>
    <circle cx="720" cy="655" r="6" fill="#60a5fa"/>
  </g>

  <!-- Arrow 9→10 + Cover Letter →10 -->
  <line x1="840" y1="710" x2="840" y2="745" class="flow-line"/>
  <line x1="570" y1="645" x2="570" y2="700" class="flow-line"/>
  <line x1="570" y1="700" x2="840" y2="745" class="flow-line"/>

  <!-- Cover Letter Agent -->
  <g>
    <rect x="440" y="660" width="260" height="65" rx="8" class="node-box" stroke="#c084fc"/>
    <text x="570" y="688" text-anchor="middle" class="node-text">Cover Letter Agent</text>
    <text x="570" y="705" text-anchor="middle" class="node-subtext">AI: HTML Cover Letter</text>
    <circle cx="450" cy="670" r="6" fill="#c084fc"/>
  </g>

  <!-- ====================== NODE 10: BUILD CAPTION ====================== -->
  <g>
    <rect x="710" y="730" width="260" height="65" rx="8" class="node-box" stroke="#a78bfa">
      <animate attributeName="stroke" values="#374151;#a78bfa;#a78bfa;#374151;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="840" y="758" text-anchor="middle" class="node-text">10. Build Caption + Cover Letter</text>
    <text x="840" y="775" text-anchor="middle" class="node-subtext">Code: Score Bar + HTML Attachment</text>
    <circle cx="720" cy="740" r="6" fill="#a78bfa"/>
  </g>

  <!-- Final split to Telegram -->
  <line x1="970" y1="762" x2="1010" y2="810" class="flow-line"/>
  <line x1="970" y1="762" x2="1010" y2="840" class="flow-line"/>

  <!-- ====================== NODE 11: TELEGRAM PDF ====================== -->
  <g>
    <rect x="950" y="795" width="240" height="55" rx="8" class="node-box" stroke="#34d399">
      <animate attributeName="stroke" values="#374151;#34d399;#34d399;#34d399;#374151" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="1070" y="820" text-anchor="middle" class="node-text">11. Send Resume via Telegram</text>
    <text x="1070" y="837" text-anchor="middle" class="node-subtext">PDF Document with ATS Score</text>
    <circle cx="960" cy="805" r="6" fill="#34d399"/>
  </g>

  <!-- ====================== NODE 12: TELEGRAM CL ====================== -->
  <g>
    <rect x="950" y="840" width="240" height="55" rx="8" class="node-box" stroke="#f472b6"/>
    <text x="1070" y="865" text-anchor="middle" class="node-text">12. Send Cover Letter</text>
    <text x="1070" y="882" text-anchor="middle" class="node-subtext">HTML Document via Telegram</text>
    <circle cx="960" cy="850" r="6" fill="#f472b6"/>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="245" height="140" rx="8" fill="#111" stroke="#374151" stroke-width="1" opacity="0.8"/>
    <text x="122" y="22" text-anchor="middle" class="node-text" font-size="12" font-weight="bold">Legend</text>
    <circle cx="20" cy="42" r="5" fill="#667eea"/><text x="32" y="46" class="node-subtext">AI Agent (Gemini/GPT)</text>
    <circle cx="20" cy="62" r="5" fill="#f472b6"/><text x="32" y="66" class="node-subtext">Code Node (JavaScript)</text>
    <circle cx="20" cy="82" r="5" fill="#f59e0b"/><text x="32" y="86" class="node-subtext">HTTP Request (API)</text>
    <circle cx="20" cy="102" r="5" fill="#34d399"/><text x="32" y="106" class="node-subtext">Telegram Delivery</text>
    <circle cx="20" cy="122" r="5" fill="#fcd34d"/><text x="32" y="126" class="node-subtext">Merge / Flow Control</text>
  </g>

  <!-- Status info box -->
  <g transform="translate(50, 680)">
    <rect x="0" y="0" width="300" height="100" rx="8" fill="#111" stroke="#374151" stroke-width="1" opacity="0.8"/>
    <text x="150" y="22" text-anchor="middle" class="node-text" font-size="12" font-weight="bold">Execution Status</text>
    <text x="15" y="45" class="node-subtext" font-size="11">
      <tspan x="15" dy="0">⏳ Form Submitted</tspan>
      <tspan x="15" dy="18">📂 Resume Extracted</tspan>
      <tspan x="15" dy="18">🧠 AI Processing...</tspan>
    </text>
    <text x="180" y="45" class="node-subtext" font-size="11">
      <tspan x="180" dy="0" fill="#fcd34d">⏺ Waiting...</tspan>
      <tspan x="180" dy="18" fill="#34d399">✅ Complete</tspan>
      <tspan x="180" dy="18" fill="#667eea">🔵 Active</tspan>
    </text>
  </g>

  <!-- Status bar at bottom -->
  <rect x="0" y="895" width="1200" height="5" fill="url(#accent)"/>
</svg>
